# Production vhost for the SmartShala dashboard and API.
#
# One origin serves both. The web dashboard calls {host}/{SCHOOLCODE}/api/...
# and the mobile apps call {host}/{SCHOOLCODE}/api/v1/..., so the school-scoped
# API lives at the URL root rather than under /api/ and needs its own regex
# location. School codes are 8 uppercase alphanumerics; every Next.js route is
# lowercase, so the two never collide.

upstream smartshala_api { server 127.0.0.1:4000; keepalive 32; }
upstream smartshala_web { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name app.letssmartshala.com;
    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.letssmartshala.com;

    ssl_certificate     /etc/letsencrypt/live/app.letssmartshala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.letssmartshala.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Student document and bulk-import uploads.
    client_max_body_size 20m;
    client_body_timeout 120s;

    access_log /var/log/nginx/smartshala.access.log;
    error_log  /var/log/nginx/smartshala.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    # Tenant-scoped API: /{SCHOOLCODE}/api/... (web) and /{SCHOOLCODE}/api/v1/... (apps).
    location ~ ^/[A-Z0-9]{8}/api(/|$) {
        proxy_pass http://smartshala_api;
        # The assistant answers over SSE; buffering would hold the whole stream.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Super-admin, CRM and other routes that carry no school code.
    location /api/ {
        proxy_pass http://smartshala_api;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Razorpay posts here and the handler verifies the raw body's HMAC.
    location /webhooks/ { proxy_pass http://smartshala_api; }
    location /health/    { proxy_pass http://smartshala_api; }

    location /_next/static/ {
        proxy_pass http://smartshala_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / { proxy_pass http://smartshala_web; }
}
